<style>
  .e404 { min-height: 100svh; display: grid; align-content: center; gap: 26px; padding-block: 60px; }
  .e404__brand { position: static; }
  .e404__kicker { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
  .e404__title { font-family: var(--font-display); font-size: var(--step-5); line-height: 0.9; letter-spacing: -0.04em; }
  .e404__title em { font-family: var(--font-serif); font-style: italic; font-weight: 400; color: var(--acid); }
  .e404__copy { max-width: 46ch; color: var(--muted); font-size: 1.02rem; }
  .e404__actions { display: flex; flex-wrap: wrap; gap: 12px; }
</style>
</head>
<body>
<main class="wrap e404">
  <a class="brand e404__brand" href="/" aria-label="GMA Marketing Solutions — home">
    <span class="brand__mark" aria-hidden="true">
      <svg viewBox="0 0 40 40" fill="none" aria-hidden="true">
        <path d="M4 34V6h9.6l6.4 12.4L26.4 6H36v28h-8.2V19.6L20 32.4 12.2 19.6V34H4Z" fill="currentColor"/>

      </svg>
    </span>
    <span class="brand__text">
      <strong>GMA</strong>
      <span>Marketing Solutions</span>
    </span>
  </a>

  <p class="e404__kicker">Error 404</p>
  <h1 class="e404__title">This page<br />is <em>off-brief.</em></h1>
  <p class="e404__copy">The link you followed doesn’t exist — or it moved. Everything worth reading is one click back.</p>

  <div class="e404__actions">
    <a class="btn btn--acid" href="/"><span>Back to home</span></a>
    <a class="btn" href="/#contact"><span>Book a call</span></a>
  </div>
</main>
</body>
</html>
